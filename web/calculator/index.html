<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, responsive, and accessible personal calculator built with vanilla HTML, CSS, and JavaScript.">
  <title>Personal Calculator | Developer Practice Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator-wrapper">
    <div class="calculator-card" role="region" aria-label="Personal Calculator">
      <header class="calculator-header">
        <h1 class="calculator-title">Calculator</h1>
        <span class="badge">Vanilla JS</span>
      </header>

      <section class="display-container" aria-live="polite" aria-atomic="true">
        <div class="previous-operand" id="previousOperand" data-previous-operand aria-label="Previous expression"></div>
        <div class="current-operand" id="currentOperand" data-current-operand aria-label="Current input">0</div>
      </section>

      <section class="keypad" role="group" aria-label="Calculator keypad">
        <!-- Row 1 -->
        <button type="button" class="btn btn-action" data-action="all-clear" aria-label="All clear">AC</button>
        <button type="button" class="btn btn-action" data-action="delete" aria-label="Delete last character">DEL</button>
        <button type="button" class="btn btn-action" data-action="percent" aria-label="Percentage">%</button>
        <button type="button" class="btn btn-operator" data-operator="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button type="button" class="btn btn-number" data-number="7">7</button>
        <button type="button" class="btn btn-number" data-number="8">8</button>
        <button type="button" class="btn btn-number" data-number="9">9</button>
        <button type="button" class="btn btn-operator" data-operator="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button type="button" class="btn btn-number" data-number="4">4</button>
        <button type="button" class="btn btn-number" data-number="5">5</button>
        <button type="button" class="btn btn-number" data-number="6">6</button>
        <button type="button" class="btn btn-operator" data-operator="-" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button type="button" class="btn btn-number" data-number="1">1</button>
        <button type="button" class="btn btn-number" data-number="2">2</button>
        <button type="button" class="btn btn-number" data-number="3">3</button>
        <button type="button" class="btn btn-operator" data-operator="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button type="button" class="btn btn-action" data-action="negate" aria-label="Toggle positive or negative">±</button>
        <button type="button" class="btn btn-number" data-number="0">0</button>
        <button type="button" class="btn btn-number" data-number=".">.</button>
        <button type="button" class="btn btn-equals" data-action="calculate" aria-label="Equals">=</button>
      </section>

      <footer class="calculator-footer">
        <p class="hint">Keyboard support enabled: <code>0-9</code>, <code>+ - * /</code>, <code>Enter</code>, <code>Esc</code>, <code>Backspace</code></p>
      </footer>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
